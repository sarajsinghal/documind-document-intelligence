[theme]
base = "light"
primaryColor = "#256B58"
backgroundColor = "#F7F7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2825"
linkColor = "#256B58"
borderColor = "#E4E7DF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2.2rem", "1.8rem", "1.45rem", "1.2rem", "1rem", "0.9rem"]
headingFontWeights = [650, 650, 650, 600, 600, 550]
chartCategoricalColors = ["#256B58", "#D08C3F", "#5D83A8", "#A45D52", "#7D7397"]

[theme.sidebar]
backgroundColor = "#F0F1EA"
secondaryBackgroundColor = "#E7EADF"
textColor = "#25352F"
primaryColor = "#256B58"
borderColor = "#DDE1D7"
